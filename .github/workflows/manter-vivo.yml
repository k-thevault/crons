name: Manter vivo
# O GitHub DESATIVA sozinho os agendamentos de um repositorio publico apos
# 60 dias sem atividade. Um repo que so roda cron nao recebe commit nenhum,
# entao ele se auto-desligaria em silencio por volta de outubro.
# Este workflow faz um commit minimo 1x por mes so para zerar esse contador.
# NAO REMOVER.
on:
  schedule:
    # Minuto quebrado de proposito, NAO :00 — ver drak-djen.yml. Aqui pesa
    # DOBRADO: se o GitHub pular esta unica rodada do mes, o repo pode passar
    # dos 60 dias sem commit e ter TODOS os agendamentos desativados.
    - cron: "17 5 1 * *"   # dia 1 de cada mes, 02h17 BRT
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Marca atividade
        run: |
          set -eu
          date -u +"ultima marca de atividade: %Y-%m-%d" > VIVO.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VIVO.txt
          git diff --staged --quiet || git commit -m "keepalive: mantem os agendamentos ativos"
          git push
