name: DraK — DJEN ingest
# Repo PUBLICO de proposito: Actions e ilimitado em repo publico.
# Este repo NAO contem codigo nem dado — so o agendamento.
# REGRA DE OURO: nunca imprimir o corpo da resposta (log publico).
on:
  schedule:
    - cron: "0 9,12,15,18,21 * * *"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Chama /api/cron/ingest
        env:
          APP_URL: ${{ secrets.DRAK_APP_URL }}
          CRON_SECRET: ${{ secrets.DRAK_CRON_SECRET }}
        run: |
          set -eu
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" -m 290 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/ingest")
          echo "HTTP ${STATUS}"
          [ "$STATUS" = "200" ] || { echo "falhou (corpo omitido: log publico)"; exit 1; }
