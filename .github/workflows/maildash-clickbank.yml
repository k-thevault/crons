name: MailDash — ClickBank
# Repo PUBLICO de proposito: Actions e ilimitado em repo publico.
# Este repo NAO contem codigo nem dado — so o agendamento.
# REGRA DE OURO: nunca imprimir o corpo da resposta (log publico).
#
# Em 10/08/2026 o funil americano (ES1) migrou de Digistore para ClickBank.
# Este e o gemeo do maildash-digistore.yml; os dois seguem vivos (a Digistore
# ainda tem vendas) e batem no MESMO banco do DashApp.
#
# Horario: minuto 52, a cada 3h (02:52, 05:52 ... 23:52 UTC). Fora do minuto
# :00 pela regra do CLAUDE.md, e a rodada das 02:52 cai 13 min ANTES do
# /api/cron/daily-snapshot da Vercel (03:05 UTC), que fecha o dia BRT em
# 03:00 UTC — assim o snapshot de ontem ja inclui estas vendas.
on:
  schedule:
    - cron: "52 2-23/3 * * *"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Chama /api/cron/sync-clickbank
        env:
          APP_URL: ${{ secrets.MAILDASH_APP_URL }}
          CRON_SECRET: ${{ secrets.MAILDASH_CRON_SECRET }}
        run: |
          set -eu
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" -m 290 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/sync-clickbank")
          echo "HTTP ${STATUS}"
          [ "$STATUS" = "200" ] || { echo "falhou (corpo omitido: log publico)"; exit 1; }
