name: MailDash — ClickBank
# Repo PUBLICO de proposito: Actions e ilimitado em repo publico.
# Este repo NAO contem codigo nem dado — so o agendamento.
# REGRA DE OURO: nunca imprimir o corpo da resposta (log publico).
#
# Em 10/08/2026 o funil americano (ES1) migrou de Digistore para ClickBank.
# Este e o gemeo do maildash-digistore.yml; os dois seguem vivos (a Digistore
# ainda tem vendas) e batem no MESMO banco do DashApp.
#
# HORARIO (ajustado em 31/08/2026): minuto 34, de 3 em 3 horas, MAIS uma rodada
# extra as 04:34 UTC. O dia BRT que o /api/cron/daily-snapshot fecha termina as
# 03:00 UTC, e o snapshot roda as 06:05 UTC — entao as rodadas das 03:34 e 04:34
# caem DEPOIS do corte e ANTES do snapshot. O horario anterior (02:52) era antes
# do corte: venda feita entre 23:52 BRT e a meia-noite ficava de fora.
#
# A rodada extra e redundancia deliberada: o agendador do GitHub as vezes PULA
# uma execucao em silencio, e a ClickBank nao entrega webhook no MailDash — nao
# ha reserva. Upsert por order_id = idempotente.
#
# Mexeu aqui? Confira maildash-digistore.yml e o cron da Vercel em vercel.json.
on:
  schedule:
    - cron: "34 */3 * * *"
    - cron: "34 4 * * *"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Chama /api/cron/sync-clickbank
        env:
          APP_URL: ${{ secrets.MAILDASH_APP_URL }}
          CRON_SECRET: ${{ secrets.MAILDASH_CRON_SECRET }}
        run: |
          set -eu
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" -m 290 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/sync-clickbank")
          echo "HTTP ${STATUS}"
          [ "$STATUS" = "200" ] || { echo "falhou (corpo omitido: log publico)"; exit 1; }
